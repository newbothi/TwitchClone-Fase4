[pytest]
testpaths = tests
addopts = -q
markers =
    sqlserver: pruebas contra un SQL Server real (necesitan ANALYTICS_TEST_SQL)
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    # Starlette 1.x avisa que su TestClient pasará de httpx a httpx2; no afecta a las pruebas.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
